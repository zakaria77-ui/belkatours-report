name: Update client report

on:
  schedule:
    # Toutes les 6 heures (4x/jour) — heure UTC
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          API_VERSION: ${{ vars.API_VERSION }}
          DATE_PRESET: ${{ vars.DATE_PRESET }}
          AGENCY_NAME: ${{ vars.AGENCY_NAME }}
          RANGE_SINCE: ${{ vars.RANGE_SINCE }}
          RANGE_UNTIL: ${{ vars.RANGE_UNTIL }}
        run: node generate-report.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "belkatours-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change in report, skipping commit."
          else
            git commit -m "Auto-update client report"
            git push
          fi
