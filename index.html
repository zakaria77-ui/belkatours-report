<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Belkatours Agency — Rapport Meta Ads</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-spend:   #2a78d6;
    --series-conv:    #1baf7a;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --accent-bg:      #eef4fc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff;
      --text-secondary: #c3c2b7; --text-muted: #898781; --gridline: #2c2c2a;
      --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-spend: #3987e5; --series-conv: #199e70; --accent-bg: #142033;
    }
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--page-plane); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 16px 60px; }
  .wrap{ max-width: 1180px; margin: 0 auto; }
  header.top{ margin-bottom:18px; }
  .brand .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:600; }
  .brand h1{ margin:4px 0 2px; font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .brand .acct{ font-size:13px; color:var(--text-secondary); }

  .range-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:22px; }
  .range-btn{ font:inherit; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-secondary); cursor:pointer; white-space:nowrap; }
  .range-btn:hover{ background:var(--accent-bg); }
  .range-btn.active{ background:var(--series-spend); border-color:var(--series-spend); color:#fff; }
  .range-sep{ width:1px; align-self:stretch; background:var(--border); margin:0 4px; }
  .range-custom{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .range-custom input[type=date]{ font:inherit; font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--page-plane); color:var(--text-primary); }
  .range-custom button{ font:inherit; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--series-spend); background:var(--series-spend); color:#fff; cursor:pointer; }
  .range-label{ margin-left:auto; font-size:12px; color:var(--text-muted); }

  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:2px; background: var(--border); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:22px; }
  @media (min-width:560px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); } }
  @media (min-width:900px){ .kpi-grid{ grid-template-columns:repeat(8,1fr); } }
  .kpi{ background: var(--surface-1); padding:16px 16px 14px; display:flex; flex-direction:column; gap:6px; min-height:88px; }
  .kpi .label{ font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .value{ font-size:22px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .section{ margin-bottom:26px; }
  .section-head{ margin-bottom:10px; }
  .section-head h3{ margin:0; font-size:14px; font-weight:700; }
  .card{ background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .charts-row{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:760px){ .charts-row{ grid-template-columns:1.3fr 1fr; } }
  .chart-box{ position:relative; height:220px; }
  .chart-box svg{ display:block; width:100%; height:100%; overflow:visible; }
  .chart-title{ font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:10px; }
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:520px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--gridline); white-space:nowrap; }
  thead th.num, td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--gridline); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  td.name{ max-width:220px; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .empty-note{ font-size:12.5px; color:var(--text-muted); padding:20px 4px; text-align:center; }
  .footnote{ font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:30px; line-height:1.6; }
  .loading, .error-box{ text-align:center; padding:80px 20px; color:var(--text-muted); font-size:14px; }
  .error-box{ color:var(--critical); }
  .age-bar-track{ width:100%; min-width:80px; height:8px; background:var(--gridline); border-radius:999px; overflow:hidden; }
  .age-bar-fill{ height:100%; background:var(--series-conv); border-radius:999px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Rapport Meta Ads</span>
      <h1 id="acctName">Chargement…</h1>
      <span class="acct" id="acctSub"></span>
    </div>
  </header>
  <div id="app"><div class="loading">Chargement des données…</div></div>
</div>

<script>
// =================================================================
// CONFIG - the only thing that ever needs to change here is the URL
// below if the Apps Script Web App is ever redeployed.
// =================================================================
var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxm7GZDy6zf7gRaeVKYwGDv9dTDYdu9Obsnu3083o0qttF8VT6eFWriq3nYpgYI7x2E/exec";
var CLIENT_DISPLAY_NAME = "Belkatours Agency";

var DATA = null;      // raw payload from the Web App
var CURRENCY = "USD";
var currentRange = null; // {since, until, label}

// ---------------------------------------------------------------
// Formatting helpers (mirrors the original static report exactly)
// ---------------------------------------------------------------
var numFmt = new Intl.NumberFormat("fr-FR");
function money(v) {
  try { return new Intl.NumberFormat("fr-FR", { style: "currency", currency: CURRENCY, maximumFractionDigits: 2 }).format(v || 0); }
  catch (e) { return numFmt.format(v || 0) + " " + CURRENCY; }
}
function pct(v) { return numFmt.format(Math.round((v || 0) * 100) / 100) + " %"; }
function num(v) { return numFmt.format(Math.round((v || 0) * 100) / 100); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

var ACTION_LABELS = {
  purchase: "Achats", omni_purchase: "Achats",
  lead: "Leads", offsite_conversion_fb_pixel_lead: "Leads",
  complete_registration: "Inscriptions complètes",
  add_to_cart: "Ajouts au panier",
  initiate_checkout: "Paiements initiés",
  link_click: "Clics sur le lien",
  landing_page_view: "Vues de page de destination",
  view_content: "Vues de contenu",
  add_payment_info: "Infos de paiement ajoutées",
  onsite_conversion_total_messaging_connection: "Messages",
  "onsite_conversion.total_messaging_connection": "Messages",
  "onsite_conversion.messaging_conversation_started_7d": "Messages (7j)",
  messaging_conversation_started_7d: "Messages",
  "onsite_conversion.messaging_first_reply": "Premières réponses",
  "onsite_conversion.messaging_user_depth_2_message_send": "Messages (profondeur 2)",
  "onsite_conversion.messaging_user_depth_3_message_send": "Messages (profondeur 3)",
  "onsite_conversion.post_save": "Publications enregistrées",
  "onsite_conversion.post_net_save": "Publications enregistrées (net)",
  "onsite_conversion.post_net_comment": "Commentaires (net)",
  "onsite_conversion.post_net_like": "J'aime (net)",
  post_interaction_gross: "Interactions publication (brutes)",
  post_interaction_net: "Interactions publication (nettes)",
  post_engagement: "Interactions avec la publication",
  page_engagement: "Interactions avec la page",
  post_reaction: "Réactions",
  like: "J'aime",
  comment: "Commentaires",
  post: "Publications",
  video_view: "Vues vidéo"
};
function actionLabel(type) { return ACTION_LABELS[type] || type.replace(/_/g, " ").replace(/\./g, " "); }

function actionsToMap(actions) {
  var m = {};
  (actions || []).forEach(function (a) { m[a.action_type] = (m[a.action_type] || 0) + (parseFloat(a.value) || 0); });
  return m;
}
function mapToActionsArray(m) {
  return Object.keys(m).map(function (k) { return { action_type: k, value: m[k] }; });
}

// Messaging objective first: this account's campaigns are optimized for
// Messenger/WhatsApp/IG conversations, so those action types always win
// the "primary" metric slot ahead of purchase/lead types.
var PRIORITY = [
  "onsite_conversion.total_messaging_connection",
  "onsite_conversion.messaging_conversation_started_7d",
  "messaging_conversation_started_7d",
  "onsite_conversion.messaging_first_reply",
  "purchase", "omni_purchase", "lead", "offsite_conversion_fb_pixel_lead", "complete_registration",
  "add_to_cart", "initiate_checkout", "link_click"];
function pickPrimaryActionType(actionsMap) {
  for (var i = 0; i < PRIORITY.length; i++) if (actionsMap[PRIORITY[i]]) return PRIORITY[i];
  var keys = Object.keys(actionsMap);
  return keys.length ? keys[0] : null;
}

// ---------------------------------------------------------------
// SVG charts - identical drawing logic to the original static report
// ---------------------------------------------------------------
var COLOR_SPEND = "#2a78d6", COLOR_CONV = "#1baf7a", COLOR_GRID = "#e1e0d9", COLOR_MUTED = "#898781", COLOR_SURFACE = "#fcfcfb";

function niceMax(v) {
  if (!v || v <= 0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
  var norm = v / mag;
  var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * mag;
}
function fmtDate(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }

function axesSVG(W, H, pad, maxV, yFmt) {
  var s = "";
  [0, .5, 1].forEach(function (t) {
    var y = H - pad.b - t * (H - pad.t - pad.b);
    s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="' + COLOR_GRID + '" stroke-width="1"/>';
    s += '<text x="' + (pad.l - 8) + '" y="' + (y + 3) + '" text-anchor="end" font-size="10" fill="' + COLOR_MUTED + '">' + esc(yFmt(t * maxV)) + '</text>';
  });
  return s;
}
function xLabelsSVG(xsFn, dates, H, pad) {
  var s = "";
  var n = dates.length;
  var everyN = Math.max(1, Math.ceil(n / 6));
  dates.forEach(function (d, i) {
    if (i % everyN !== 0 && i !== n - 1) return;
    var anchor = i === 0 ? "start" : (i === n - 1 ? "end" : "middle");
    s += '<text x="' + xsFn(i) + '" y="' + (H - 4) + '" text-anchor="' + anchor + '" font-size="10" fill="' + COLOR_MUTED + '">' + esc(fmtDate(d)) + '</text>';
  });
  return s;
}
function lineChartSVG(dates, values, color, yFmt) {
  var W = 400, H = 220, pad = { l: 38, r: 10, t: 12, b: 20 };
  var maxV = niceMax(Math.max.apply(null, values.concat([0])) * 1.15);
  var n = values.length;
  var xs = function (i) { return n <= 1 ? pad.l : pad.l + i * ((W - pad.l - pad.r) / (n - 1)); };
  var ys = function (v) { return H - pad.b - (v / maxV) * (H - pad.t - pad.b); };
  var body = axesSVG(W, H, pad, maxV, yFmt) + xLabelsSVG(xs, dates, H, pad);
  if (n) {
    var linePts = values.map(function (v, i) { return xs(i) + "," + ys(v); }).join(" ");
    var areaPts = "M " + xs(0) + "," + ys(0) + " L " + values.map(function (v, i) { return xs(i) + "," + ys(v); }).join(" L ") + " L " + xs(n - 1) + "," + ys(0) + " Z";
    var gradId = "grad-" + Math.random().toString(36).slice(2);
    body += '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color + '" stop-opacity="0.18"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>';
    body += '<path d="' + areaPts + '" fill="url(#' + gradId + ')" stroke="none"/>';
    body += '<polyline points="' + linePts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    var lastX = xs(n - 1), lastY = ys(values[n - 1]);
    body += '<circle cx="' + lastX + '" cy="' + lastY + '" r="4" fill="' + color + '" stroke="' + COLOR_SURFACE + '" stroke-width="2"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><g>' + body + '</g></svg>';
}
function barChartSVG(dates, values, color, yFmt) {
  var W = 400, H = 220, pad = { l: 34, r: 10, t: 12, b: 20 };
  var maxV = niceMax(Math.max.apply(null, values.concat([0])) * 1.15);
  var n = values.length;
  var bandW = n ? (W - pad.l - pad.r) / n : 0;
  var barW = Math.max(2, Math.min(22, bandW * 0.55));
  var ys = function (v) { return H - pad.b - (v / maxV) * (H - pad.t - pad.b); };
  var body = axesSVG(W, H, pad, maxV, yFmt) + xLabelsSVG(function (i) { return pad.l + i * bandW + bandW / 2; }, dates, H, pad);
  values.forEach(function (v, i) {
    var cx = pad.l + i * bandW + bandW / 2;
    var y = ys(v), h = Math.max(0, H - pad.b - y);
    body += '<rect x="' + (cx - barW / 2) + '" y="' + (h > 0 ? y : H - pad.b) + '" width="' + barW + '" height="' + Math.max(h, 0) + '" rx="4" ry="4" fill="' + color + '"/>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><g>' + body + '</g></svg>';
}

// ---------------------------------------------------------------
// KPI tiles / tables
// ---------------------------------------------------------------
function kpiGridHTML(account, primaryType, primaryLabel) {
  var actions = actionsToMap(account.actions);
  var spend = account.spend || 0;
  var primaryCount = primaryType ? (actions[primaryType] || 0) : 0;
  var cpa = primaryCount ? spend / primaryCount : null;
  var costLabel = /messag/i.test(primaryLabel) ? "Coût par message" : ("Coût / " + primaryLabel.toLowerCase());

  var tiles = [
    { label: "Dépense", value: money(spend) },
    { label: primaryLabel, value: num(primaryCount) },
    { label: costLabel, value: cpa != null ? money(cpa) : "—" },
    { label: "Couverture", value: num(account.reach) },
    { label: "Impressions", value: num(account.impressions) },
    { label: "CTR", value: pct(account.ctr) },
    { label: "CPM", value: money(account.cpm) },
    { label: "Clics", value: num(account.clicks) }
  ];
  return tiles.map(function (t) {
    return '<div class="kpi"><span class="label">' + esc(t.label) + '</span><span class="value">' + esc(t.value) + '</span></div>';
  }).join("");
}

function conversionsTableHTML(account) {
  var actions = actionsToMap(account.actions);
  var values = actionsToMap(account.action_values || []);
  var spend = account.spend || 0;
  var keys = Object.keys(actions);
  var rows = keys
    .filter(function (k) { return !/^page_engagement$|^post_engagement$/.test(k) || keys.length < 3; })
    .sort(function (a, b) { return actions[b] - actions[a]; })
    .slice(0, 12);

  if (!rows.length) return { tbody: "", empty: true };
  var tbody = rows.map(function (type) {
    var count = actions[type];
    var cost = count ? spend / count : null;
    var val = values[type];
    return "<tr>" +
      "<td class='name'>" + esc(actionLabel(type)) + "</td>" +
      "<td class='num'>" + num(count) + "</td>" +
      "<td class='num'>" + (cost != null ? money(cost) : "—") + "</td>" +
      "<td class='num'>" + (val != null ? money(val) : "—") + "</td>" +
      "</tr>";
  }).join("");
  return { tbody: tbody, empty: false };
}

function cmpRowHTML(r) {
  return "<tr>" +
    "<td class='name' title='" + esc(r.name) + "'>" + esc(r.name) + "</td>" +
    "<td class='num'>" + money(r.spend) + "</td>" +
    "<td class='num'>" + num(r.impressions) + "</td>" +
    "<td class='num'>" + num(r.reach) + "</td>" +
    "<td class='num'>" + pct(r.ctr) + "</td>" +
    "<td class='num'>" + money(r.cpm) + "</td>" +
    "<td class='num'>" + num(r.conversions) + "</td>" +
    "<td class='num'>" + (r.cpa != null ? money(r.cpa) : "—") + "</td>" +
    "</tr>";
}
function cmpTableBlock(title, rows) {
  var head = "<thead><tr><th>Nom</th><th class='num'>Dépense</th><th class='num'>Impressions</th><th class='num'>Reach</th><th class='num'>CTR</th><th class='num'>CPM</th><th class='num'>Messages</th><th class='num'>Coût / message</th></tr></thead>";
  var body = rows.length ? rows.map(cmpRowHTML).join("") : "<tr><td colspan='8' style='text-align:center;color:var(--text-muted);padding:18px;'>Rien à afficher sur cette période.</td></tr>";
  return "<div class='section'><div class='section-head'><h3>" + esc(title) + "</h3></div><div class='card table-scroll'><table>" + head + "<tbody>" + body + "</tbody></table></div></div>";
}

// ---------------------------------------------------------------
// Age breakdown table
// ---------------------------------------------------------------
var AGE_ORDER = ["13-17", "18-24", "25-34", "35-44", "45-54", "55-64", "65+"];
function ageSortKey(age) {
  var idx = AGE_ORDER.indexOf(age);
  return idx === -1 ? 999 : idx;
}
function ageTableBlock(rows) {
  var maxMsg = Math.max.apply(null, rows.map(function (r) { return r.messages; }).concat([0])) || 1;
  var totalMsg = rows.reduce(function (s, r) { return s + r.messages; }, 0);
  var body = rows.length ? rows.map(function (r) {
    var pctShare = totalMsg ? (r.messages / totalMsg) * 100 : 0;
    var barWidth = maxMsg ? Math.round((r.messages / maxMsg) * 100) : 0;
    return "<tr>" +
      "<td class='name'>" + esc(r.age) + "</td>" +
      "<td class='num'>" + num(r.messages) + "</td>" +
      "<td class='num'>" + num(pctShare) + " %</td>" +
      "<td><div class='age-bar-track'><div class='age-bar-fill' style='width:" + barWidth + "%'></div></div></td>" +
      "<td class='num'>" + money(r.spend) + "</td>" +
      "<td class='num'>" + (r.costPerMsg != null ? money(r.costPerMsg) : "—") + "</td>" +
      "<td class='num'>" + num(r.impressions) + "</td>" +
      "</tr>";
  }).join("") : "<tr><td colspan='7' style='text-align:center;color:var(--text-muted);padding:18px;'>Rien à afficher sur cette période.</td></tr>";
  var head = "<thead><tr><th>Tranche d'âge</th><th class='num'>Messages</th><th class='num'>% du total</th><th>Répartition</th><th class='num'>Dépense</th><th class='num'>Coût / message</th><th class='num'>Impressions</th></tr></thead>";
  return "<div class='section'><div class='section-head'><h3>Messages par tranche d'âge</h3></div><div class='card table-scroll'><table>" + head + "<tbody>" + body + "</tbody></table></div></div>";
}

// ---------------------------------------------------------------
// City / region breakdown table
// ---------------------------------------------------------------
function geoTableBlock(rows, geoLabel) {
  var title = "Messages par " + (geoLabel || "ville");
  var top = rows.slice(0, 25);
  var maxMsg = Math.max.apply(null, top.map(function (r) { return r.messages; }).concat([0])) || 1;
  var totalMsg = rows.reduce(function (s, r) { return s + r.messages; }, 0);
  var body = top.length ? top.map(function (r) {
    var pctShare = totalMsg ? (r.messages / totalMsg) * 100 : 0;
    var barWidth = maxMsg ? Math.round((r.messages / maxMsg) * 100) : 0;
    return "<tr>" +
      "<td class='name'>" + esc(r.place) + "</td>" +
      "<td class='num'>" + num(r.messages) + "</td>" +
      "<td class='num'>" + num(pctShare) + " %</td>" +
      "<td><div class='age-bar-track'><div class='age-bar-fill' style='width:" + barWidth + "%'></div></div></td>" +
      "<td class='num'>" + money(r.spend) + "</td>" +
      "<td class='num'>" + (r.costPerMsg != null ? money(r.costPerMsg) : "—") + "</td>" +
      "<td class='num'>" + num(r.impressions) + "</td>" +
      "</tr>";
  }).join("") : "<tr><td colspan='7' style='text-align:center;color:var(--text-muted);padding:18px;'>Rien à afficher sur cette période.</td></tr>";
  var head = "<thead><tr><th>" + esc(geoLabel === "région" ? "Région" : "Ville") + "</th><th class='num'>Messages</th><th class='num'>% du total</th><th>Répartition</th><th class='num'>Dépense</th><th class='num'>Coût / message</th><th class='num'>Impressions</th></tr></thead>";
  return "<div class='section'><div class='section-head'><h3>" + esc(title) + "</h3></div><div class='card table-scroll'><table>" + head + "<tbody>" + body + "</tbody></table></div></div>";
}

// ---------------------------------------------------------------
// Date range helpers
// ---------------------------------------------------------------
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
function todayDate() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }

function computePreset(key) {
  var today = todayDate();
  switch (key) {
    case "today": return { since: toISO(today), until: toISO(today), label: "Aujourd'hui" };
    case "yesterday": var y = addDays(today, -1); return { since: toISO(y), until: toISO(y), label: "Hier" };
    case "last7d": return { since: toISO(addDays(today, -6)), until: toISO(today), label: "7 derniers jours" };
    case "last14d": return { since: toISO(addDays(today, -13)), until: toISO(today), label: "14 derniers jours" };
    case "last30d": return { since: toISO(addDays(today, -29)), until: toISO(today), label: "30 derniers jours" };
    case "thisMonth":
      var fm = new Date(today.getFullYear(), today.getMonth(), 1);
      return { since: toISO(fm), until: toISO(today), label: "Ce mois-ci" };
    case "lastMonth":
      var lmStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      var lmEnd = new Date(today.getFullYear(), today.getMonth(), 0);
      return { since: toISO(lmStart), until: toISO(lmEnd), label: "Mois dernier" };
    case "thisYear":
      var fy = new Date(today.getFullYear(), 0, 1);
      return { since: toISO(fy), until: toISO(today), label: "Cette année" };
    case "all":
      var hs = (DATA.meta.history_since || "").slice(0, 10) || "2000-01-01";
      return { since: hs, until: toISO(today), label: "Toute la période" };
  }
}

// ---------------------------------------------------------------
// Aggregation over a date range
// ---------------------------------------------------------------
function inRange(dateStr, since, until) { return dateStr >= since && dateStr <= until; }

function aggregateAccount(since, until) {
  var rows = DATA.daily_account.filter(function (r) { return inRange(r.date, since, until); });
  var spend = 0, impressions = 0, reach = 0, clicks = 0;
  var actionsMap = {}, valuesMap = {};
  rows.forEach(function (r) {
    spend += r.spend || 0; impressions += r.impressions || 0; reach += r.reach || 0; clicks += r.clicks || 0;
    (r.actions || []).forEach(function (a) { actionsMap[a.action_type] = (actionsMap[a.action_type] || 0) + (parseFloat(a.value) || 0); });
    (r.action_values || []).forEach(function (a) { valuesMap[a.action_type] = (valuesMap[a.action_type] || 0) + (parseFloat(a.value) || 0); });
  });
  return {
    spend: spend, impressions: impressions, reach: reach, clicks: clicks,
    ctr: impressions ? (clicks / impressions) * 100 : 0,
    cpm: impressions ? (spend / impressions) * 1000 : 0,
    actions: mapToActionsArray(actionsMap),
    action_values: mapToActionsArray(valuesMap)
  };
}

function aggregateGroup(rows, since, until, idField, nameField, primaryType, sortBy) {
  var filtered = rows.filter(function (r) { return inRange(r.date, since, until); });
  var groups = {};
  filtered.forEach(function (r) {
    var id = r[idField];
    if (!groups[id]) groups[id] = { id: id, name: r[nameField] || "(sans nom)", spend: 0, impressions: 0, reach: 0, clicks: 0, actionsMap: {} };
    var g = groups[id];
    g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.reach += r.reach || 0; g.clicks += r.clicks || 0;
    (r.actions || []).forEach(function (a) { g.actionsMap[a.action_type] = (g.actionsMap[a.action_type] || 0) + (parseFloat(a.value) || 0); });
  });
  var out = Object.keys(groups).map(function (id) {
    var g = groups[id];
    var conversions = primaryType ? (g.actionsMap[primaryType] || 0) : 0;
    return {
      id: g.id, name: g.name, spend: g.spend, impressions: g.impressions, reach: g.reach,
      ctr: g.impressions ? (g.clicks / g.impressions) * 100 : 0,
      cpm: g.impressions ? (g.spend / g.impressions) * 1000 : 0,
      conversions: conversions,
      cpa: conversions ? g.spend / conversions : null
    };
  });
  if (sortBy === "conversions") {
    out.sort(function (a, b) { return b.conversions - a.conversions; });
  } else {
    out.sort(function (a, b) { return b.spend - a.spend; });
  }
  return out;
}

function aggregateAge(since, until, primaryType) {
  var rows = (DATA.daily_age || []).filter(function (r) { return inRange(r.date, since, until); });
  var groups = {};
  rows.forEach(function (r) {
    var age = r.age || "unknown";
    if (!groups[age]) groups[age] = { age: age, spend: 0, impressions: 0, clicks: 0, actionsMap: {} };
    var g = groups[age];
    g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.clicks += r.clicks || 0;
    (r.actions || []).forEach(function (a) { g.actionsMap[a.action_type] = (g.actionsMap[a.action_type] || 0) + (parseFloat(a.value) || 0); });
  });
  var out = Object.keys(groups).map(function (age) {
    var g = groups[age];
    var messages = primaryType ? (g.actionsMap[primaryType] || 0) : 0;
    return {
      age: age, spend: g.spend, impressions: g.impressions, clicks: g.clicks,
      messages: messages,
      costPerMsg: messages ? g.spend / messages : null
    };
  });
  out.sort(function (a, b) { return ageSortKey(a.age) - ageSortKey(b.age); });
  return out;
}

function aggregateGeo(since, until, primaryType) {
  var rows = (DATA.daily_city || []).filter(function (r) { return inRange(r.date, since, until); });
  var groups = {};
  rows.forEach(function (r) {
    var place = r.place || "unknown";
    if (!groups[place]) groups[place] = { place: place, spend: 0, impressions: 0, clicks: 0, actionsMap: {} };
    var g = groups[place];
    g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.clicks += r.clicks || 0;
    (r.actions || []).forEach(function (a) { g.actionsMap[a.action_type] = (g.actionsMap[a.action_type] || 0) + (parseFloat(a.value) || 0); });
  });
  var out = Object.keys(groups).map(function (place) {
    var g = groups[place];
    var messages = primaryType ? (g.actionsMap[primaryType] || 0) : 0;
    return {
      place: place, spend: g.spend, impressions: g.impressions, clicks: g.clicks,
      messages: messages,
      costPerMsg: messages ? g.spend / messages : null
    };
  }).filter(function (r) { return r.place && r.place !== "unknown"; });
  out.sort(function (a, b) { return b.messages - a.messages; });
  return out;
}

function dailySeries(since, until, primaryType) {
  var rows = DATA.daily_account.filter(function (r) { return inRange(r.date, since, until); }).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var dates = rows.map(function (r) { return r.date; });
  var spendVals = rows.map(function (r) { return r.spend || 0; });
  var convVals = rows.map(function (r) { return actionsToMap(r.actions)[primaryType] || 0; });
  return { dates: dates, spendVals: spendVals, convVals: convVals };
}

// ---------------------------------------------------------------
// Render
// ---------------------------------------------------------------
function render() {
  var since = currentRange.since, until = currentRange.until;
  var accountRow = aggregateAccount(since, until);
  var actionsMap = actionsToMap(accountRow.actions);
  var primaryType = pickPrimaryActionType(actionsMap);
  var primaryLabel = primaryType ? actionLabel(primaryType) : "Messages";

  var series = dailySeries(since, until, primaryType);
  var spendChart = series.dates.length ? lineChartSVG(series.dates, series.spendVals, COLOR_SPEND, function (v) { return money(v); }) : "<p class='empty-note'>Pas de données sur cette période.</p>";
  var convChart = series.dates.length ? barChartSVG(series.dates, series.convVals, COLOR_CONV, function (v) { return num(Math.round(v)); }) : "<p class='empty-note'>Pas de données sur cette période.</p>";

  var kpiHTML = kpiGridHTML(accountRow, primaryType, primaryLabel);
  var conv = conversionsTableHTML(accountRow);
  var convTableHTML = "<table><thead><tr><th>Type de conversion</th><th class='num'>Nombre</th><th class='num'>Coût / conversion</th><th class='num'>Valeur générée</th></tr></thead><tbody>" + conv.tbody + "</tbody></table>" +
    (conv.empty ? "<p class='empty-note'>Aucune conversion enregistrée sur cette période.</p>" : "");

  var ageRows = aggregateAge(since, until, primaryType);
  var ageBlockHTML = ageTableBlock(ageRows);

  var geoLabel = DATA.meta.geo_breakdown_type === "region" ? "région" : "ville";
  var geoRows = aggregateGeo(since, until, primaryType);
  var geoBlockHTML = geoTableBlock(geoRows, geoLabel);

  var campaignCmp = aggregateGroup(DATA.daily_campaign, since, until, "campaign_id", "campaign_name", primaryType, "spend");

  var html =
    '<div class="kpi-grid">' + kpiHTML + '</div>' +
    '<div class="section"><div class="section-head"><h3>Évolution sur la période</h3></div><div class="card"><div class="charts-row">' +
    '<div><div class="chart-title">Dépense quotidienne</div><div class="chart-box">' + spendChart + '</div></div>' +
    '<div><div class="chart-title">Messages quotidiens</div><div class="chart-box">' + convChart + '</div></div>' +
    '</div></div></div>' +
    ageBlockHTML +
    geoBlockHTML +
    '<div class="section"><div class="section-head"><h3>Détail des conversions</h3></div><div class="card table-scroll">' + convTableHTML + '</div></div>' +
    cmpTableBlock("Performance par campagne", campaignCmp) +
    '<p class="footnote">Rapport de performance préparé par ' + esc(DATA.meta.agency_name || "Kaylest Agency") + '. Événement de conversion principal suivi : ' + esc(primaryLabel) + '. Données mises à jour automatiquement plusieurs fois par jour ; dernière synchronisation : ' + esc(formatSyncTime(DATA.meta.last_updated)) + '.</p>';

  document.getElementById("app").innerHTML = html;
  document.getElementById("acctSub").textContent = "Période : " + currentRange.label + " (" + currentRange.since + " au " + currentRange.until + ")";
}

function formatSyncTime(iso) {
  if (!iso) return "—";
  try {
    var d = new Date(iso);
    return d.toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
  } catch (e) { return iso; }
}

// ---------------------------------------------------------------
// Range bar UI
// ---------------------------------------------------------------
var PRESETS = [
  ["today", "Aujourd'hui"], ["yesterday", "Hier"], ["last7d", "7 jours"], ["last14d", "14 jours"],
  ["last30d", "30 jours"], ["thisMonth", "Ce mois-ci"], ["lastMonth", "Mois dernier"],
  ["thisYear", "Cette année"], ["all", "Tout"]
];

function renderRangeBar() {
  var bar = document.createElement("div");
  bar.className = "range-bar";
  bar.id = "rangeBar";

  PRESETS.forEach(function (p) {
    var btn = document.createElement("button");
    btn.className = "range-btn";
    btn.textContent = p[1];
    btn.dataset.preset = p[0];
    btn.onclick = function () {
      setActivePreset(p[0]);
      currentRange = computePreset(p[0]);
      syncCustomInputs();
      render();
    };
    bar.appendChild(btn);
  });

  var sep = document.createElement("div");
  sep.className = "range-sep";
  bar.appendChild(sep);

  var customWrap = document.createElement("div");
  customWrap.className = "range-custom";
  var since = DATA.meta.history_since ? DATA.meta.history_since.slice(0, 10) : "2000-01-01";
  var untilBound = toISO(todayDate());
  customWrap.innerHTML =
    '<input type="date" id="sinceInput" min="' + since + '" max="' + untilBound + '">' +
    '<span style="color:var(--text-muted);font-size:12px;">au</span>' +
    '<input type="date" id="untilInput" min="' + since + '" max="' + untilBound + '">' +
    '<button id="applyCustom">Appliquer</button>';
  bar.appendChild(customWrap);

  document.querySelector(".wrap").insertBefore(bar, document.getElementById("app"));

  document.getElementById("applyCustom").onclick = function () {
    var s = document.getElementById("sinceInput").value;
    var u = document.getElementById("untilInput").value;
    if (!s || !u || s > u) { alert("Merci de choisir une date de début antérieure ou égale à la date de fin."); return; }
    setActivePreset(null);
    currentRange = { since: s, until: u, label: "Période personnalisée" };
    render();
  };
}

function setActivePreset(key) {
  var btns = document.querySelectorAll(".range-btn");
  btns.forEach(function (b) { b.classList.toggle("active", b.dataset.preset === key); });
}
function syncCustomInputs() {
  var si = document.getElementById("sinceInput"), ui = document.getElementById("untilInput");
  if (si) si.value = currentRange.since;
  if (ui) ui.value = currentRange.until;
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
fetch(WEBAPP_URL)
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (json) {
    DATA = json;
    CURRENCY = json.meta.currency || "USD";
    document.getElementById("acctName").textContent = json.meta.display_name || CLIENT_DISPLAY_NAME;
    renderRangeBar();
    setActivePreset("last30d");
    currentRange = computePreset("last30d");
    syncCustomInputs();
    render();
  })
  .catch(function (err) {
    document.getElementById("acctName").textContent = "Rapport indisponible";
    document.getElementById("app").innerHTML = '<div class="error-box">Impossible de charger les données pour le moment (' + esc(err.message) + '). Merci de réessayer dans quelques instants, ou de contacter l\'agence si le problème persiste.</div>';
  });
</script>
</body>
